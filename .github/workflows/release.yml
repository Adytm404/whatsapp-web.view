name: Release

on:
  push:
    tags:
      - "v*"

env:
  GO_VERSION: "1.26"
  APP_NAME: whatsapp-webview

permissions:
  contents: write

jobs:
  # ──────────────────────────────────────────────
  # Build all platforms
  # ──────────────────────────────────────────────
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
            artifact: whatsapp-webview-linux-amd64
          - target: linux-arm64
            goos: linux
            goarch: arm64
            artifact: whatsapp-webview-linux-arm64
          - target: windows-amd64
            goos: windows
            goarch: amd64
            artifact: whatsapp-webview-windows-amd64.exe
            ldflags_extra: "-H windowsgui"
          - target: macos-arm64
            goos: darwin
            goarch: arm64
            artifact: whatsapp-webview-macos-arm64
          - target: macos-amd64
            goos: darwin
            goarch: amd64
            artifact: whatsapp-webview-macos-amd64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          LDFLAGS="-s -w"
          if [ -n "${{ matrix.ldflags_extra }}" ]; then
            LDFLAGS="${LDFLAGS} ${{ matrix.ldflags_extra }}"
          fi
          go build -ldflags="${LDFLAGS}" -o dist/${{ matrix.artifact }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  # ──────────────────────────────────────────────
  # Test Linux binary
  # ──────────────────────────────────────────────
  test-linux:
    name: Test Linux
    runs-on: ubuntu-latest
    needs: build
    container:
      image: ubuntu:22.04
      options: --privileged

    steps:
      - name: Install deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            xvfb libwebkit2gtk-4.1-0 libgtk-3-0 dbus dbus-x11 procps

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: whatsapp-webview-linux-amd64
          path: dist

      - name: Run test
        run: |
          chmod +x dist/whatsapp-webview-linux-amd64
          Xvfb :99 -screen 0 1280x720x24 &
          sleep 1
          export DISPLAY=:99
          set +e
          timeout 10 dist/whatsapp-webview-linux-amd64 2>&1
          CODE=$?
          set -e
          echo "Exit: ${CODE}"
          [ "${CODE}" -eq 124 ] || [ "${CODE}" -eq 0 ]

  # ──────────────────────────────────────────────
  # Package .deb
  # ──────────────────────────────────────────────
  package-deb:
    name: Package .deb
    runs-on: ubuntu-latest
    needs: test-linux

    steps:
      - uses: actions/checkout@v4

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: whatsapp-webview-linux-amd64
          path: dist

      - name: Build .deb
        run: |
          chmod +x dist/whatsapp-webview-linux-amd64
          VERSION=${GITHUB_REF_NAME#v}
          bash build-deb.sh dist/whatsapp-webview-linux-amd64 ${VERSION}

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: package-deb
          path: dist/*.deb

  # ──────────────────────────────────────────────
  # Create GitHub Release
  # ──────────────────────────────────────────────
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, test-linux, package-deb]

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Organize release files
        run: |
          mkdir -p release
          # Copy binaries
          for f in artifacts/whatsapp-webview-*/whatsapp-webview-*; do
            cp "$f" release/
          done
          # Copy .deb
          cp artifacts/package-deb/*.deb release/ 2>/dev/null || true
          # Generate checksums
          cd release
          sha256sum * > SHA256SUMS.txt
          echo "=== Release Files ==="
          ls -lh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ github.ref_name }}"
          body: |
            ## WhatsApp Webview ${{ github.ref_name }}

            ### Downloads

            | Platform | File | Notes |
            |----------|------|-------|
            | Linux x64 | `whatsapp-webview-linux-amd64` | Requires `webkit2gtk-4.1` |
            | Linux ARM64 | `whatsapp-webview-linux-arm64` | Requires `webkit2gtk-4.1` |
            | Windows x64 | `whatsapp-webview-windows-amd64.exe` | Requires WebView2 Runtime |
            | macOS ARM64 | `whatsapp-webview-macos-arm64` | Uses WKWebView (built-in) |
            | macOS x64 | `whatsapp-webview-macos-amd64` | Uses WKWebView (built-in) |
            | Ubuntu/Debian | `whatsapp-webview_*.deb` | `sudo dpkg -i` |

            ### Linux Dependencies

            ```bash
            # Ubuntu/Debian
            sudo apt install libwebkit2gtk-4.1-0

            # Arch Linux
            sudo pacman -S webkit2gtk-4.1

            # Fedora
            sudo dnf install webkit2gtk4.1
            ```
          files: release/*
          draft: false
          prerelease: false
